[project]
name = "foxcam"
version = "0.1.0"
description = "Tapo camera recorder: segments streams, queues detection jobs for external workers, serves a web UI."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "astral>=3.2",
]

[project.optional-dependencies]
# Experimental: stream Tapo cameras through the TP-Link cloud relay (unofficial, reverse engineered).
tapo-cloud = ["ontapo>=0.1.0"]
# Upload clips/recordings to S3-compatible object storage (AWS, R2, B2, MinIO…).
s3 = ["boto3>=1.35"]
# Notifications to ~100 services (Telegram, Discord, Pushover, Gotify, e-mail…) via Apprise.
# ntfy and webhooks work without it.
notify = ["apprise>=1.9"]

[project.scripts]
foxcam = "foxcam.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "moto[s3]>=5", "boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foxcam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
