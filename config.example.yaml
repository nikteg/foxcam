# Copy to config.yaml. ${VAR} and ${VAR:-default} are expanded from the environment.

data_dir: ${FOXCAM_DATA_DIR:-./data}

# Length of each recorded file. Can be overridden per camera.
segment_seconds: 60

# Workers need an access token: create one per worker in the web UI (Worker queue → Add
# worker) or with `foxcam worker-token <name>`. Optionally also a shared secret:
worker_token: ${FOXCAM_WORKER_TOKEN:-}
# open_worker_access: true   # any client may act as a worker - trusted test networks only

# Cameras are easiest to add in the web UI (Cameras -> Add camera); they can also be listed
# here (read-only in the UI). For test cameras from the sample clips run `mise run seed`;
# `mise run cameras:remove-test` removes them again with their recordings.
cameras: []
  # Loop a local video file as a fake camera (handy with a fox clip to test detection).
  # - id: foxclip
  #   source: { type: file, path: ./samples/fox.mp4 }

  # EXPERIMENTAL: Tapo camera via the TP-Link cloud relay (no LAN access needed).
  # Run `uv run foxcam tapo-login` once to create the session, then `ingest`.
  # - id: garden
  #   name: Garden
  #   source: { type: tapo_cloud, device_name: "Garden", resolution: HD }

  # Tapo camera reachable over RTSP (same LAN, or via Tailscale/WireGuard to the cabin).
  # Create a "Camera Account" in the Tapo app first. stream1 = HD, stream2 = SD.
  # - id: porch
  #   name: Porch
  #   segment_seconds: 120
  #   source: { type: rtsp, url: "rtsp://${TAPO_USER}:${TAPO_PASS}@192.168.1.50:554/stream1" }

mediamtx:
  api_url: ${MEDIAMTX_API_URL:-http://localhost:9997}
  rtsp_url: ${MEDIAMTX_RTSP_URL:-rtsp://localhost:8554}
  # MediaMTX's WebRTC / HLS servers as seen by this server. Browsers watch live view
  # through the server (behind the login), never directly.
  webrtc_url: ${MEDIAMTX_WEBRTC_URL:-http://localhost:8889}
  hls_url: ${MEDIAMTX_HLS_URL:-http://localhost:8888}
  # Password the server, ingest and transcoders use with MediaMTX (user foxcam in
  # mediamtx.yml). Unset = a random one in data/mediamtx/password; start MediaMTX with
  # `foxcam mediamtx` to hand it over. Only set it when MediaMTX runs elsewhere
  # (there: MTX_AUTHINTERNALUSERS_0_PASS=<the same>).
  # password: ${FOXCAM_MTX_PASSWORD}
  # Where MediaMTX writes recordings, as seen by the MediaMTX process.
  # Leave unset when MediaMTX and the server see the same path.
  record_dir: ${MEDIAMTX_RECORD_DIR:-}
  # "Low data" live view: <camera>/low, transcoded by MediaMTX only while someone watches.
  low_data:
    enabled: true
    height: 480
    bitrate_kbit: 500
    fps: 15
  # Hardware video encoding/decoding for the transcodes (low-data live, masks, recording
  # profiles): auto picks the best that works where MediaMTX runs, else the CPU.
  # auto | none | videotoolbox | nvenc | qsv | vaapi | amf | mf | vulkan  (docs/HARDWARE.md)
  hwaccel: auto
  # hw_device: /dev/dri/renderD128   # Linux render node for vaapi / qsv

# Recording profiles (quality and retention per camera, chosen on the Cameras page).
# Built in: original (as the camera sends it), 1080p, 720p, 480p, h265 (1080p H.265).
# Cameras without their own choice use the default. Admins can also set it in the UI
# (Recording dialog), which wins over this:
recording_profile_default: original
# Add your own, or replace a built-in one by id:
recording_profiles: []
#  - id: archive
#    name: Long-term, small
#    transcode: true
#    codec: h265
#    max_height: 720
#    fps: 10
#    bitrate_kbit: 500
#    keep_days: 60          # instead of retention.segments_days

processing:
  sample_fps: 2          # frames/s in the censored copy sent to workers
  max_width: 1280
  concurrency: 2
  night_saturation_threshold: 4.0   # IR night footage is grayscale
  keep_non_targets_from: 0.25       # non-matches below this are not kept (0 = keep all)

queue:
  lease_seconds: 300
  max_attempts: 3
  retry_backoff_seconds: 60

# What to look for: add detection profiles in the web UI (Cameras → Detection profiles),
# or under `profiles:` below. Uncomment this for a quick built-in `default` profile instead
# (used only when there is no `profiles:`), run on every camera by any worker.
# detection:
#   # YOLO-World is prompted with these: one word per thing, synonyms lower every score.
#   target_labels: [fox]
#   # Other models' names for a target (SpeciesNet says "red fox").
#   aliases: { red fox: fox, vulpes vulpes: fox }
#   min_confidence: 0.5

# Detection profiles (optional; can also be added in the web UI under Cameras). Each
# recording is analysed once per profile its camera runs. A worker only gets a profile's
# jobs if it has all `requires` tags (its detector name, `open-vocabulary` for YOLO-World,
# plus `--tags` / tags on its access token). Open-vocabulary workers are prompted with the
# profile's targets, so they can look for anything.
# profiles:
#   - id: wildlife
#     name: Wildlife
#     targets: [fox, badger]
#     aliases: { red fox: fox, vulpes vulpes: fox, european badger: badger }
#     min_confidence: 0.5
#     target_min_confidence: { badger: 0.35 }   # a target's own threshold (wins over the rest)
#     requires: [speciesnet]
#     default: true            # cameras without their own selection run it
#     # Several models instead (one job each; their detections merge into one event):
#     # detectors:
#     #   - { id: yolo, requires: [open-vocabulary], min_confidence: 0.3, fps: 1 }
#     #   - { id: speciesnet, requires: [speciesnet] }
#     # Or as a cascade: SpeciesNet only looks where YOLO found something, and events
#     # count once it agrees:
#     #   - { id: speciesnet, requires: [speciesnet], run: on_hit, after: yolo, confirm: true }
#   - id: vehicles
#     targets: [car, person]
#     requires: [open-vocabulary]
#     fps: 1                   # fewer frames: cheaper
#     still_minutes: 10        # default; no motion under it this long: no match until it
#                              # moves (a parked car, a stump). 0 = must be moving now, null = off
#     skip_without_motion: true  # recordings where nothing moved get no jobs of this profile
#     events_days: 14          # overrides retention.events_days
#
# Per camera (or in the UI: Cameras → Detection):  profiles: [wildlife, vehicles]

# Motion detection on the censored derivative (pipeline/motion.py), used by profiles with
# still_minutes / skip_without_motion. Per camera (Cameras → Settings → Detection →
# Motion detection): its own sensitivity and areas whose movement is ignored.
motion:
  sensitivity: medium       # low, medium, high: for cameras without their own
  light_change_fraction: 0.5  # more of the picture changing at once is light, not motion
  window_seconds: 1         # motion this close in time to a detection counts for it

events:
  pre_roll_seconds: 10
  post_roll_seconds: 10
  merge_gap_seconds: 30
  settle_seconds: 90

# Join finished segments into one file per camera and hour (`foxcam compact`),
# re-encoding per recording profile. Detection still works on the short segments.
compaction:
  enabled: true
  period_minutes: 60
  delay_minutes: 10         # after the hour ends (late segments, preprocessing)

retention:
  # The Settings page (Retention) can change the first four; values set there win.
  segments_days: 7          # ordinary footage
  unprocessed_max_days: 14  # footage still waiting for a worker
  events_days: 0            # events (clip + footage); 0 = keep forever
  max_disk_gb: null         # e.g. 200 - oldest unpinned footage deleted first
  delete_derived_after_done: true

storage:
  # Optional copy of clips (and recordings) in S3-compatible object storage: AWS S3,
  # Cloudflare R2, Backblaze B2, MinIO, Hetzner, Wasabi… Needs the `s3` extra (included
  # in the Docker image). The UI serves files locally while they exist and otherwise
  # redirects to a short-lived signed URL, so the bucket can stay private.
  s3:
    enabled: false
    bucket: my-fox-clips
    endpoint_url: null        # null = AWS; e.g. https://<account>.r2.cloudflarestorage.com
    region: null              # e.g. eu-north-1 (R2: auto)
    # Leave null to use the standard AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env vars.
    access_key_id: null
    secret_access_key: null
    prefix: foxcam/
    addressing_style: auto    # path for MinIO and most self-hosted stores
    clips: true               # upload fox event clips + thumbnails
    recordings: false         # also archive every finished segment
    delete_local_clips: false # free local disk once a clip is uploaded
    recordings_days: 0        # delete archived recordings from the bucket after N days; 0 = never
    presign_seconds: 3600

# Link target for notifications: how you open the web UI. https:// also makes the session
# cookie Secure.
# public_url: http://192.168.1.10:8000
# Behind a reverse proxy that isn't on this machine (e.g. Docker): its address, so the
# login limits see real client addresses (docs/AUTH.md). Default $FORWARDED_ALLOW_IPS or
# 127.0.0.1.
# trusted_proxies: [172.18.0.1]

# Accounts (docs/AUTH.md). Everything except the worker API needs a login; the first start
# prints a setup code for creating the first admin in the web UI.
auth:
  enabled: true
  password_login: true
  # invite: only with an invite link (cameras are shared with links or by e-mail)
  # open: anyone who reaches the server may sign up | closed: admins add users
  registration: invite
  # Always admins; may also sign up through OAuth without an invite (first admin without
  # a password).
  admin_emails: []
  session_days: 30
  # New accounts may add their own cameras (they own them and decide who else sees them).
  # Admins change it per account in Settings → Users.
  users_can_add_cameras: false
  # The most cameras an account (not an admin) may add; null = no limit.
  max_cameras_per_user: 2
  # Sign in with Google / Microsoft / GitHub / any OpenID Connect provider. Register the
  # redirect URL <how you open the UI>/api/auth/oauth/<id>/callback at the provider.
  oauth: []
  #  - id: google
  #    type: google
  #    client_id: ${GOOGLE_CLIENT_ID:-}
  #    client_secret: ${GOOGLE_CLIENT_SECRET:-}
  #  - id: github
  #    type: github
  #    client_id: ${GITHUB_CLIENT_ID:-}
  #    client_secret: ${GITHUB_CLIENT_SECRET:-}
  #  - id: authentik
  #    type: oidc
  #    name: Authentik
  #    issuer: https://auth.example.org/application/o/foxcam/
  #    client_id: ${OIDC_CLIENT_ID:-}
  #    client_secret: ${OIDC_CLIENT_SECRET:-}
  #    allowed_domains: [example.org]

# Notifications when an event starts (event.new) or its clip is ready (event.clip).
# Channels can also be added in the web UI (Settings -> Notifications). docs/NOTIFICATIONS.md
# notifications:
#   timezone: Europe/Stockholm      # quiet hours and times in messages (also in Settings)
#   max_age_minutes: 15             # events seen longer ago notify nobody; 0 = no limit
#   channels:
#     - id: phone
#       type: ntfy                  # push via ntfy.sh or a self-hosted ntfy
#       topic: foxes-at-the-cabin-7f3k
#       when: [event.new, event.clip]   # note: `when`, not `on` (YAML reads on as true)
#       quiet_hours: "23:00-06:00"
#       # min_agreement: 2            # wait until two of the profile's models saw it
#     - id: home-assistant
#       type: webhook                # JSON POST, optionally HMAC-signed
#       url: http://homeassistant.local:8123/api/webhook/foxcam-events
#       secret: ${WEBHOOK_SECRET:-}
#     - id: telegram
#       type: apprise               # ~100 services; needs the notify extra
#       url: tgram://${TELEGRAM_BOT_TOKEN:-}/${TELEGRAM_CHAT_ID:-}

location:
  # Used for sun elevation (day/night fallback, cameras' sun limit) and as a hint to workers
  # (SpeciesNet geofence). Also in Settings → General; a camera can have its own.
  latitude: null
  longitude: null
  country: SWE
