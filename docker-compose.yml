# Recorder box: MediaMTX + media-streamer (web/pipeline) + ingest publishers.
# Workers run elsewhere (GPU machine) and only need HTTP access to port 8000.
#
#   docker compose up --build
#
# Optional environment (e.g. in .env): MEDIA_CONFIG (config file), MEDIA_DATA_PATH (data
# folder), *_PORT (host ports), MEDIA_WORKER_TOKEN. With MEDIA_CONFIG=./config.docker.yaml
# no config file is needed: PUBLIC_URL and MAX_DISK_GB come from the environment.
#
# server and ingest share MediaMTX's network namespace: MediaMTX's API is local only, video
# needs the internal login (mediamtx/mediamtx.yml), and browsers reach live view through
# the server (behind the login). The
# first start prints a setup code for the first account: docker compose logs server
services:
  mediamtx:
    # Same image as the server: MediaMTX runs `media-streamer transcode` (masks, recording
    # profiles, low-data live) with ffmpeg and the GPU drivers in it. Hardware encoding:
    # add docker-compose.vaapi.yml (Intel / AMD) or docker-compose.nvidia.yml.
    build: { context: ., dockerfile: server/Dockerfile }
    image: media-streamer:local
    # Started through media-streamer: it sets the password the server, ingest and the
    # transcoders sign in with (see mediamtx.yml). Whichever container starts first creates
    # it in data/mediamtx/. MediaMTX faces the network, so it gets only that folder and the
    # recordings: no config.yaml, database or other secrets.
    command: ["mediamtx", "/mediamtx.yml", "--password-file", "/data/mediamtx/password"]
    restart: unless-stopped
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ${MEDIA_DATA_PATH:-./data}/mediamtx:/data/mediamtx
      - ${MEDIA_DATA_PATH:-./data}/recordings:/data/recordings
    environment:
      TZ: UTC # recording file names in UTC (they include the offset either way)
    ports:
      - "${HTTP_PORT:-8000}:8000" # web UI, API and live view (the server, see below)
      - "${WEBRTC_ICE_PORT:-8189}:8189/tcp" # WebRTC media (over TCP, see mediamtx.yml)
      # RTSP for other players; needs a user with a password in mediamtx.yml:
      # - "${RTSP_PORT:-8554}:8554"

  server:
    build: { context: ., dockerfile: server/Dockerfile }
    image: media-streamer:local
    restart: unless-stopped
    command: ["serve"]
    depends_on: [mediamtx]
    network_mode: service:mediamtx # port 8000 is published by the mediamtx service
    volumes:
      - ${MEDIA_CONFIG:-./config.yaml}:/app/config.yaml:ro
      - ${MEDIA_DATA_PATH:-./data}:/data
      - ./samples:/app/samples:ro
    environment:
      MEDIA_DATA_DIR: /data
      MEDIA_WORKER_TOKEN: ${MEDIA_WORKER_TOKEN:-}
      # Used by config.docker.yaml.
      PUBLIC_URL: ${PUBLIC_URL:-}
      MAX_DISK_GB: ${MAX_DISK_GB:-}
      # Behind a reverse proxy: its address as this container sees it (docs/AUTH.md).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # S3 credentials, if not in config.yaml (storage.s3).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

  ingest:
    build: { context: ., dockerfile: server/Dockerfile }
    image: media-streamer:local
    restart: unless-stopped
    command: ["ingest"]
    depends_on: [mediamtx]
    network_mode: service:mediamtx
    volumes:
      - ${MEDIA_CONFIG:-./config.yaml}:/app/config.yaml:ro
      - ${MEDIA_DATA_PATH:-./data}:/data
      - ./samples:/app/samples:ro
    environment:
      MEDIA_DATA_DIR: /data

  compact:
    # Joins each finished hour into one file per camera, re-encoding it when the camera's
    # recording profile says so (GPU via docker-compose.vaapi.yml / .nvidia.yml).
    build: { context: ., dockerfile: server/Dockerfile }
    image: media-streamer:local
    restart: unless-stopped
    command: ["compact"]
    volumes:
      - ${MEDIA_CONFIG:-./config.yaml}:/app/config.yaml:ro
      - ${MEDIA_DATA_PATH:-./data}:/data
    environment:
      MEDIA_DATA_DIR: /data
