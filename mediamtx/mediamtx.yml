# MediaMTX config. Camera paths are NOT defined here: media-streamer pushes them through
# the control API on startup (source, recording, segment length).

logLevel: info

# The control API, HLS and WebRTC servers only listen locally: media-streamer configures
# MediaMTX through the API and serves live view to browsers itself (/api/live/..., behind
# the login). Only the RTSP port and the WebRTC media port (8189) need to be reachable.
api: yes
apiAddress: 127.0.0.1:9997

rtsp: yes
rtspAddress: :8554
rtmp: no
srt: no
# Media over QUIC (MediaMTX 1.21+): not used; it would also need ports 8892/8893.
moq: no

hls: yes
hlsAddress: 127.0.0.1:8888
hlsAlwaysRemux: no

webrtc: yes
webrtcAddress: 127.0.0.1:8889
# WebRTC media over TCP instead of UDP. 1080p camera streams send keyframes in bursts that
# overflow the default UDP socket buffers (badly on macOS: "dropped due to full socket
# buffers", MediaMTX "reader is too slow"), freezing the live view after a few seconds.
# TCP plays smoothly at a little extra latency.
webrtcLocalUDPAddress: ''
webrtcLocalTCPAddress: :8189
# When running in Docker, add the host's LAN IP (or Tailscale IP) so browsers can connect:
# webrtcAdditionalHosts: [192.168.1.10]

# Only processes on this machine may publish, read or use the API: the server (live view
# proxy, snapshots), ingest and the transcoders MediaMTX starts. Browsers go through the
# server, which checks the login and who may see which camera (docs/AUTH.md).
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics
  # To watch over RTSP from another device (VLC, Home Assistant), add a user with a
  # password and read access, e.g. rtsp://viewer:<password>@<host>:8554/<camera>:
  # - user: viewer
  #   pass: change-me
  #   permissions:
  #     - action: read

pathDefaults:
  record: no

paths:
  all_others:
