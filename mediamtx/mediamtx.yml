# MediaMTX config. Camera paths are NOT defined here: media-streamer pushes them through
# the control API on startup (source, recording, segment length).

logLevel: info

# The control API, HLS and WebRTC servers only listen locally: media-streamer configures
# MediaMTX through the API and serves live view to browsers itself (/api/live/..., behind
# the login). Only the RTSP port and the WebRTC media port (8189) need to be reachable.
api: yes
apiAddress: 127.0.0.1:9997

rtsp: yes
rtspAddress: :8554
rtmp: no
srt: no
# Media over QUIC (MediaMTX 1.21+): not used; it would also need ports 8892/8893.
moq: no

hls: yes
hlsAddress: 127.0.0.1:8888
hlsAlwaysRemux: no

webrtc: yes
webrtcAddress: 127.0.0.1:8889
# WebRTC media over TCP instead of UDP. 1080p camera streams send keyframes in bursts that
# overflow the default UDP socket buffers (badly on macOS: "dropped due to full socket
# buffers", MediaMTX "reader is too slow"), freezing the live view after a few seconds.
# TCP plays smoothly at a little extra latency.
webrtcLocalUDPAddress: ''
webrtcLocalTCPAddress: :8189
# When running in Docker, add the host's LAN IP (or Tailscale IP) so browsers can connect:
# webrtcAdditionalHosts: [192.168.1.10]

# Video only for the server (live view proxy, snapshots), ingest and the transcoders
# MediaMTX starts, signed in as media-streamer. Browsers go through the server, which
# checks the login and who may see which camera (docs/AUTH.md). Local addresses alone are
# not trusted with video: a camera source can point back at this machine.
authMethod: internal
authInternalUsers:
  # Keep this user first. Start MediaMTX with `media-streamer mediamtx`, which sets its
  # password (MTX_AUTHINTERNALUSERS_0_PASS) to the one in data/mediamtx-password or
  # config.yaml (mediamtx.password). The hash below matches no password: started any
  # other way, nobody gets video.
  - user: media-streamer
    pass: sha256:Q0WQ2LdOSsIiQl8FqEhUZbnnPWAMoWFfRiYDYgeQ4R8=
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
      - action: read
      - action: playback
  # The control API (the server configures paths): local processes only.
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
  # To watch over RTSP from another device (VLC, Home Assistant), add a user with a
  # password and read access, e.g. rtsp://viewer:<password>@<host>:8554/<camera>:
  # - user: viewer
  #   pass: change-me
  #   permissions:
  #     - action: read

pathDefaults:
  record: no

paths:
  all_others:
