[tool.uv.workspace]
members = ["server", "worker"]

[tool.uv]
# The worker's detector backends pin incompatible dependencies (SpeciesNet -> numpy<2 via
# yolov5), so they are resolved separately; install one at a time. SpeciesNet also needs
# Python <= 3.12 (no numpy<2 wheels for newer Pythons).
conflicts = [
  [
    { package = "foxcam-worker", extra = "ultralytics" },
    { package = "foxcam-worker", extra = "speciesnet" },
  ],
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# FastAPI's `param = Depends(...)` default arguments are the framework's idiom.
extend-ignore = ["B008"]
