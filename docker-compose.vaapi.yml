# Hardware video encoding/decoding with Intel (VAAPI / Quick Sync) or AMD (VAAPI) GPUs:
#
#   docker compose -f docker-compose.yml -f docker-compose.vaapi.yml up -d
#   docker compose exec mediamtx foxcam hwaccel     # what works
#
# Several GPUs: pick the render node with FOXCAM_HW_DEVICE (and mediamtx.hw_device).
services:
  mediamtx:
    devices:
      - ${FOXCAM_HW_DEVICE:-/dev/dri/renderD128}:${FOXCAM_HW_DEVICE:-/dev/dri/renderD128}
    # Intel before Broadwell: add `environment: { LIBVA_DRIVER_NAME: i965 }` (and install
    # i965-va-driver). Newer Intel (iHD) and AMD (radeonsi) are picked automatically.
  server: # decodes and scales new recordings for the workers (preprocessing)
    devices:
      - ${FOXCAM_HW_DEVICE:-/dev/dri/renderD128}:${FOXCAM_HW_DEVICE:-/dev/dri/renderD128}
  compact: # re-encodes finished hours (recording profiles)
    devices:
      - ${FOXCAM_HW_DEVICE:-/dev/dri/renderD128}:${FOXCAM_HW_DEVICE:-/dev/dri/renderD128}
