# Developer tasks: `mise tasks` lists them, `mise run <task>` runs one.
#
#   mise run setup        # first time: Python + web deps, config.yaml, MediaMTX, sample clips
#   mise run dev          # whole stack with a dummy worker
#   mise run seed         # (stack running) add a fake camera per sample clip
#   mise run check        # lint + typecheck + tests
#   mise run reset        # wipe all data (asks first); reset:events, reset:queue, ... for parts

# --- setup -------------------------------------------------------------------------

[tasks.setup]
description = "Install everything for local development"
depends = ["setup:python", "setup:web", "setup:config", "setup:mediamtx", "setup:samples"]
run = "echo 'ready: mise run dev'"

[tasks."setup:python"]
description = "Python deps for server + worker (tapo-cloud and s3 extras)"
run = "uv sync --all-packages --extra tapo-cloud --extra s3"

[tasks."setup:yolo"]
description = "Python deps including Ultralytics / YOLO-World for a local worker"
run = "uv sync --all-packages --extra tapo-cloud --extra s3 --extra ultralytics"

[tasks."setup:speciesnet"]
description = "SpeciesNet worker in its own Python 3.12 env (out/speciesnet-venv)"
run = [
  "uv venv --python 3.12 --allow-existing out/speciesnet-venv",
  "VIRTUAL_ENV=out/speciesnet-venv uv pip install -e './worker[speciesnet]'",
]

[tasks."setup:web"]
description = "Web UI deps"
run = "pnpm --dir web install"

[tasks."setup:config"]
description = "Create config.yaml from config.example.yaml if missing"
run = "[ -f config.yaml ] && echo 'config.yaml exists' || { cp config.example.yaml config.yaml && echo 'created config.yaml'; }"

[tasks."setup:mediamtx"]
description = "Download MediaMTX into .tools/ (FORCE=1 to update)"
run = "scripts/get_mediamtx.sh"

[tasks."setup:samples"]
description = "Download the fox test clips from Wikimedia Commons into samples/"
run = "[ -n \"$(ls samples/*.mp4 2>/dev/null)\" ] && [ -z \"${FORCE:-}\" ] && echo 'samples present (FORCE=1 to refetch)' || uv run python scripts/fetch_samples.py"

# --- run ---------------------------------------------------------------------------

[tasks.dev]
description = "Whole stack: MediaMTX, server, ingest, web (hot reload), dummy worker"
depends = ["setup:config", "setup:mediamtx"]
run = "scripts/dev.sh"

[tasks."dev:no-worker"]
description = "Whole stack without a worker (run your GPU worker elsewhere)"
depends = ["setup:config", "setup:mediamtx"]
env = { WORKER_ARGS = "none" }
run = "scripts/dev.sh"

[tasks."dev:yolo"]
description = "Whole stack with a local YOLO-World worker (needs setup:yolo)"
depends = ["setup:config", "setup:mediamtx"]
env = { WORKER_ARGS = "--detector ultralytics --model yolov8s-worldv2.pt" }
run = "scripts/dev.sh"

[tasks.server]
description = "Server only (API + pipeline) on :8000, restarts on code changes"
run = "uv run foxcam serve --host 0.0.0.0 --port 8000 --reload"

[tasks.ingest]
description = "Ingest only (publishes file / test / Tapo cloud cameras), restarts when ingest code changes"
run = "uv run watchfiles --filter python 'foxcam ingest' server/src/foxcam/ingest"

[tasks.compact]
description = "Compaction only: join finished hours into one file per camera (re-encode per recording profile)"
run = "uv run foxcam compact"

[tasks.mediamtx]
description = "MediaMTX only (recording names in UTC)"
depends = ["setup:mediamtx"]
run = "TZ=UTC uv run foxcam mediamtx --binary .tools/mediamtx mediamtx/mediamtx.yml"

[tasks.web]
description = "Web dev server with hot reload on :5173"
run = "pnpm --dir web dev --host"

[tasks.worker]
description = "Dummy worker against FOXCAM_SERVER (default http://localhost:8000)"
run = "FOXCAM_WORKER_TOKEN=${FOXCAM_WORKER_TOKEN:-$(uv run foxcam worker-token dev --save data/dev-worker.token)} uv run foxcam-worker --server ${FOXCAM_SERVER:-http://localhost:8000} --detector dummy --dummy-label fox"

[tasks."worker:yolo"]
description = "YOLO-World worker, prompted with each job's profile targets (needs setup:yolo)"
run = "FOXCAM_WORKER_TOKEN=${FOXCAM_WORKER_TOKEN:-$(uv run foxcam worker-token dev --save data/dev-worker.token)} uv run foxcam-worker --server ${FOXCAM_SERVER:-http://localhost:8000} --detector ultralytics --model yolov8s-worldv2.pt"

[tasks."worker:speciesnet"]
description = "SpeciesNet worker (needs setup:speciesnet)"
run = "FOXCAM_WORKER_TOKEN=${FOXCAM_WORKER_TOKEN:-$(uv run foxcam worker-token dev --save data/dev-worker.token)} out/speciesnet-venv/bin/foxcam-worker --server ${FOXCAM_SERVER:-http://localhost:8000} --detector speciesnet"

[tasks.doctor]
description = "Check ffmpeg, GPU, detectors and the connection to FOXCAM_SERVER"
run = "FOXCAM_WORKER_TOKEN=${FOXCAM_WORKER_TOKEN:-$(uv run foxcam worker-token dev --save data/dev-worker.token)} uv run foxcam-worker doctor --server ${FOXCAM_SERVER:-http://localhost:8000}"

[tasks."worker:token"]
description = "Create a worker access token: mise run worker:token -- <name> [--tags gpu]"
run = "uv run foxcam worker-token"

[tasks."user:add"]
description = "Create an account: mise run user:add -- <e-mail> [--admin] (asks for the password)"
run = "uv run foxcam user add"

[tasks."user:password"]
description = "Set a password: mise run user:password -- <e-mail>"
run = "uv run foxcam user password"

[tasks."user:list"]
description = "List the accounts"
run = "uv run foxcam user list"

[tasks."tapo:login"]
description = "Sign in to the Tapo cloud (password typed locally, never stored)"
run = "uv run foxcam tapo-login"

[tasks.stop]
description = "Kill anything still listening on the dev ports (8000, 5173, MediaMTX)"
run = """
pids=$(lsof -ti tcp:8000,5173,8554,8888,8889,9997 2>/dev/null || true)
if [ -n "$pids" ]; then kill $pids && echo "stopped: $(echo $pids | tr '\\n' ' ')"; else echo "nothing running"; fi
"""

# --- test data ---------------------------------------------------------------------

[tasks.seed]
description = "Running server: add a fake camera per sample clip (+ --profiles for examples)"
run = "uv run python scripts/seed.py"

[tasks.screenshots]
description = "Regenerate docs/screenshots from a throwaway demo stack (sample clips, YOLO-World if installed)"
depends = ["build", "setup:mediamtx", "setup:samples"]
run = "uv run --with playwright python scripts/screenshots.py"

[tasks."s3:local"]
description = "Local S3 (SeaweedFS in Docker on :19000) for testing storage.s3"
run = """
docker run -d --rm --name foxcam-s3 -p 19000:8333 chrislusf/seaweedfs server -s3 -dir=/data >/dev/null
echo "S3 on http://localhost:19000 - add to config.yaml and restart the server:"
cat <<'YAML'
storage:
  s3:
    enabled: true
    bucket: foxcam
    endpoint_url: http://localhost:19000
    region: us-east-1
    access_key_id: any
    secret_access_key: any
    addressing_style: path
YAML
echo "create the bucket once: uv run python -c \\"import boto3; boto3.client('s3', endpoint_url='http://localhost:19000', aws_access_key_id='any', aws_secret_access_key='any', region_name='us-east-1').create_bucket(Bucket='foxcam')\\""
"""

[tasks."s3:stop"]
description = "Stop the local S3 container (its data is discarded)"
run = "docker rm -f foxcam-s3"

# --- quality -----------------------------------------------------------------------

[tasks.test]
description = "Server + worker tests"
run = "uv run pytest server/tests worker/tests"

[tasks."test:detectors"]
description = "Accuracy tests on samples/ with YOLO-World (needs setup:yolo + setup:samples)"
env = { FOXCAM_WORKER_TEST_DETECTOR = "ultralytics", FOXCAM_WORKER_TEST_CLASSES = "fox" }
run = "uv run pytest worker/tests"

[tasks.lint]
description = "ruff (Python) + oxlint (web)"
run = ["uv run ruff check server worker", "pnpm --dir web lint"]

[tasks.fmt]
description = "Auto-fix: ruff (imports etc.) + oxfmt (web)"
run = ["uv run ruff check --fix server worker", "pnpm --dir web exec oxfmt src"]

[tasks.check]
description = "Everything CI would check: lint, typecheck, format check, tests"
run = ["uv run ruff check server worker", "pnpm --dir web check", "uv run pytest server/tests worker/tests"]

[tasks.build]
description = "Build the web UI into web/dist (served by the server on :8000)"
run = "pnpm --dir web build"

# --- docker ------------------------------------------------------------------------

[tasks."docker:up"]
description = "Docker stack (MediaMTX + server + ingest) on :8000"
run = "docker compose up --build -d"

[tasks."docker:down"]
description = "Stop the Docker stack"
run = "docker compose down"

[tasks."docker:logs"]
description = "Follow the Docker stack logs"
run = "docker compose logs -f"

[tasks."docker:test"]
description = "Second Docker stack on :18000 with its own data (out/docker-data), next to dev"
run = """
FOXCAM_DATA_PATH=./out/docker-data HTTP_PORT=18000 WEBRTC_ICE_PORT=18189 \
docker compose -p foxcam-test up --build -d
echo "http://localhost:18000  (stop: mise run docker:test-down)"
"""

[tasks."docker:test-down"]
description = "Stop the second Docker stack"
run = "docker compose -p foxcam-test down"

# --- clean / reset -----------------------------------------------------------------

[tasks.clean]
description = "Remove build output and caches (keeps data, deps, models)"
run = """
rm -rf web/dist web/tsconfig.tsbuildinfo .pytest_cache .ruff_cache
find server worker scripts -name __pycache__ -type d -prune -exec rm -rf {} + 2>/dev/null || true
echo "cleaned build output and caches"
"""

[tasks.server-stopped]
hide = true
run = """
if lsof -ti tcp:8000 >/dev/null 2>&1; then
  echo "the server is running on :8000; stop it first (Ctrl+C or mise run stop)" >&2
  exit 1
fi
"""

[tasks."cameras:remove-test"]
description = "Remove test cameras (sample-file loops, test patterns) and data of removed cameras"
depends = ["server-stopped"]
confirm = "Delete the test cameras with their recordings and events?"
run = "uv run foxcam remove-cameras --test --orphaned --yes"

[tasks."reset:recordings"]
description = "All footage plus segments, jobs, detections and events (keeps cameras, masks, profiles, workers)"
depends = ["server-stopped"]
confirm = "Delete recordings?"
run = "uv run foxcam reset recordings --yes"

[tasks."reset:events"]
description = "Events and clips only; rebuilt from the detections on the next start"
depends = ["server-stopped"]
confirm = "Delete events?"
run = "uv run foxcam reset events --yes"

[tasks."reset:detections"]
description = "Detections, events and jobs; recordings on disk are analysed again"
depends = ["server-stopped"]
confirm = "Delete detections?"
run = "uv run foxcam reset detections --yes"

[tasks."reset:queue"]
description = "Waiting jobs (the backlog); recordings and results kept"
depends = ["server-stopped"]
confirm = "Delete queue?"
run = "uv run foxcam reset queue --yes"

[tasks."reset:workers"]
description = "Known workers and all access tokens (workers need new tokens)"
depends = ["server-stopped"]
confirm = "Delete workers?"
run = "uv run foxcam reset workers --yes"

[tasks."reset:cameras"]
description = "Cameras added in the UI and every camera's masks, private flag, profile choice"
depends = ["server-stopped"]
confirm = "Delete cameras?"
run = "uv run foxcam reset cameras --yes"

[tasks."reset:profiles"]
description = "Profiles added in the UI and per-camera profile choices"
depends = ["server-stopped"]
confirm = "Delete profiles?"
run = "uv run foxcam reset profiles --yes"

[tasks."reset:users"]
description = "All accounts, sessions, shares and invite links (setup code again on next start)"
depends = ["server-stopped"]
confirm = "Delete users?"
run = "uv run foxcam reset users --yes"

[tasks."reset:tapo"]
description = "The saved Tapo cloud session"
depends = ["server-stopped"]
confirm = "Delete tapo?"
run = "uv run foxcam reset tapo --yes"

[tasks.reset]
description = "Delete ALL data: recordings, database, Tapo session (reset:<what> for parts)"
depends = ["server-stopped"]
confirm = "Delete data/ (recordings, database, Tapo session)?"
run = """
rm -rf data auto.key auto.crt
echo "data reset; config.yaml and samples/ kept"
"""

[tasks."clean:all"]
description = "Back to a fresh checkout: data, deps, models, MediaMTX, samples (keeps config.yaml)"
confirm = "Delete data/, .venv, web/node_modules, out/ (models!), .tools/ and samples/?"
depends = ["clean"]
run = """
rm -rf data auto.key auto.crt .venv web/node_modules out .tools
find samples -mindepth 1 ! -name README.md -delete 2>/dev/null || true
echo "everything removed; mise run setup to start again"
"""
