[project]
name = "foxcam-worker"
version = "0.1.0"
description = "Detection worker for foxcam: leases jobs over HTTP, runs a pluggable detector, posts results."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# Open-vocabulary ("fox") or fine-tuned YOLO / RT-DETR models.
ultralytics = [
    "ultralytics>=8.3",
    # Text encoder for YOLO-World's open-vocabulary prompts (provides the `clip` module that
    # Ultralytics would otherwise try to pip-install from GitHub at runtime).
    "clip-anytorch>=2.6",
    # clip-anytorch imports pkg_resources, which setuptools 82 removed.
    "setuptools<82",
]
# Ultralytics models on Intel GPUs (and faster on Intel CPUs): --device intel:gpu.
openvino = ["openvino>=2024.6"]
# Google's camera-trap ensemble: MegaDetector + species classifier (has "red fox").
speciesnet = ["speciesnet>=5.0"]

[project.scripts]
foxcam-worker = "foxcam_worker.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foxcam_worker"]

