[project]
name = "media-worker"
version = "0.1.0"
description = "Detection worker for media-streamer: leases jobs over HTTP, runs a pluggable detector, posts results."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# Open-vocabulary ("fox") or fine-tuned YOLO / RT-DETR models.
ultralytics = [
    "ultralytics>=8.3",
    # Text encoder for YOLO-World's open-vocabulary prompts (provides the `clip` module that
    # Ultralytics would otherwise try to pip-install from GitHub at runtime).
    "clip-anytorch>=2.6",
]
# Google's camera-trap ensemble: MegaDetector + species classifier (has "red fox").
speciesnet = ["speciesnet>=5.0"]

[project.scripts]
media-worker = "media_worker.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_worker"]

