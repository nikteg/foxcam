# Worker on a GPU machine (Linux, or Windows with Docker Desktop + WSL 2):
#
#   FOXCAM_SERVER=http://192.168.1.10:8000 FOXCAM_WORKER_TOKEN=msw_... \
#     docker compose -f worker/compose.yaml up --build -d
#
# Or put the variables in worker/.env. See docs/WORKER_SETUP.md.

# Compose project name (container names foxcam-worker-...). Komodo and -p use their own.
name: foxcam-worker

services:
  worker:
    build:
      context: .
      args:
        DETECTOR: ${DETECTOR:-speciesnet}
        TORCH_BACKEND: ${TORCH_BACKEND:-cu128}
    restart: unless-stopped
    command: ${WORKER_ARGS:---detector speciesnet}
    environment:
      FOXCAM_SERVER: ${FOXCAM_SERVER:?set FOXCAM_SERVER to the server URL, e.g. http://192.168.1.10:8000}
      FOXCAM_WORKER_TOKEN: ${FOXCAM_WORKER_TOKEN:-}
      FOXCAM_WORKER_ID: ${FOXCAM_WORKER_ID:-docker-gpu}
    volumes:
      - models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:
