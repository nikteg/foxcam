# Worker on a GPU machine (Linux, or Windows with Docker Desktop + WSL 2):
#
#   MEDIA_SERVER=http://192.168.1.10:8000 MEDIA_WORKER_TOKEN=msw_... \
#     docker compose -f worker/compose.yaml up --build -d
#
# Or put the variables in worker/.env. See docs/WORKER_SETUP.md.

services:
  worker:
    build:
      context: .
      args:
        DETECTOR: ${DETECTOR:-speciesnet}
        TORCH_BACKEND: ${TORCH_BACKEND:-cu128}
    restart: unless-stopped
    command: ${WORKER_ARGS:---detector speciesnet}
    environment:
      MEDIA_SERVER: ${MEDIA_SERVER:?set MEDIA_SERVER to the server URL, e.g. http://192.168.1.10:8000}
      MEDIA_WORKER_TOKEN: ${MEDIA_WORKER_TOKEN:-}
      MEDIA_WORKER_ID: ${MEDIA_WORKER_ID:-docker-gpu}
    volumes:
      - models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:
